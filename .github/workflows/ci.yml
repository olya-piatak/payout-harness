name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: suite (deployment gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q --junitxml=junit.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: junit.xml

  fault-drills:
    name: fault drills (the suite must fail when the service is broken)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python scripts/verify_faults.py
